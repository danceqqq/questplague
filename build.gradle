buildscript {
	repositories {
		maven { url = 'https://maven.minecraftforge.net' }
		maven { url = 'https://repo.spongepowered.org/maven' }
		mavenCentral()
	}
	dependencies {
		classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '5.1.+', changing: true
		classpath group: 'org.spongepowered', name: 'mixingradle', version: '0.7-SNAPSHOT'
	}
}
apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'org.spongepowered.mixin'
apply plugin: 'eclipse'

archivesBaseName = project.name + '-' + project.mcVersion

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

// Force Java 17 for compilation even if Java 21 is installed
tasks.withType(JavaCompile).configureEach {
	options.release = 17
}

mixin {
	add sourceSets.main, "${project.name.toLowerCase()}.refmap.json"
}

minecraft {
	mappings channel: 'official', version: project.mcVersion
	accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')
	runs {
		client = {
			properties 'forge.logging.markers': ''
			properties 'forge.logging.console.level': 'debug'
			properties 'terminal.ansi': 'true'
			workingDirectory project.file('run').canonicalPath
			source sourceSets.main
		}
		server = {
			properties 'forge.logging.markers': ''
			properties 'forge.logging.console.level': 'debug'
			properties 'terminal.ansi': 'true'
			workingDirectory project.file('run').canonicalPath
			source sourceSets.main
		}
	}
}

repositories {
	maven {
		name = "CurseMaven"
		url "https://www.cursemaven.com"
	}
}

sourceSets {
	main {
		resources {
			srcDir 'src/generated/resources'
		}
	}
}

dependencies {
	minecraft "net.minecraftforge:forge:${project.mcVersion}-${project.forgeVersion}"
	annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

	// Core dependencies for 1.20.1
	implementation fg.deobf('curse.maven:iceberg-520110:5838149')
	implementation fg.deobf('curse.maven:placebo-283644:6274259')
	implementation fg.deobf('curse.maven:toastcontrol-271740:4711316')
	implementation fg.deobf('curse.maven:jade-324717:6855440')
	implementation fg.deobf('curse.maven:advancementplaques-499826:6186385')

	// FTB Quests support for 1.20.1
	implementation fg.deobf('curse.maven:architectury-api-419699:5137938')
	implementation fg.deobf('curse.maven:ftblibrary-404465:7296748')
	implementation fg.deobf('curse.maven:ftbquests-289412:7260736')

	// Custom Quests support - uncomment when available for 1.20.1
	// implementation fg.deobf('curse.maven:customquests-334985:REPLACE_WITH_FILE_ID')
}

jar {
	manifest {
		attributes(["Specification-Title": project.name,
					"Specification-Vendor": project.author,
					"Specification-Version": project.version,
					"Implementation-Title": project.name,
					"Implementation-Version": project.version,
					"Implementation-Vendor" : project.author,
					"Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
					"MixinConfigs": "${project.name.toLowerCase()}.mixins.json"],)
	}
}
